<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>wash nchri lkass ou nhani rassi</title>

<style>
body{
  margin:0;
  height:100vh;
  background:#0b0b0f;
  color:white;
  font-family:Arial, sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.container{
  text-align:center;
  z-index:2;
}
h1{
  font-size:32px;
}
img{
  width:260px;
  border-radius:20px;
  margin:15px 0;
}
.buttons{
  display:flex;
  gap:15px;
  justify-content:center;
}
button{
  padding:15px 25px;
  font-size:20px;
  border:none;
  border-radius:15px;
  cursor:pointer;
}
#yes{background:#2ecc71;}
#no{background:#e74c3c;}
.yes-spam button{
  position:absolute;
  background:#2ecc71;
  border-radius:50px;
  padding:10px 20px;
}
canvas{
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
}
</style>
</head>

<body>

<div class="container" id="main">
  <h1>wash nchri lkass ou nhhani rassi</h1>

  <!-- PHOTO 1 -->
  <img src="meme">

  <div class="buttons">
    <button id="yes">YES</button>
    <button id="no">NO</button>
  </div>
</div>

<div class="yes-spam" id="spam"></div>

<!-- PHOTO 2 -->
<img id="finalImg" src="WhatsApp Image 2026-02-03 at 14.27.59.jpeg" style="display:none; position:fixed; inset:0; width:100%; height:100%; object-fit:cover;">

<canvas id="fx"></canvas>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const spam = document.getElementById("spam");
const main = document.getElementById("main");
const finalImg = document.getElementById("finalImg");

noBtn.onclick = () => {
  for(let i=0;i<5;i++){
    const b = document.createElement("button");
    b.innerText = "YES";
    b.style.left = Math.random()*100+"vw";
    b.style.top = Math.random()*100+"vh";
    b.onclick = yesBtn.onclick;
    spam.appendChild(b);
  }
};

yesBtn.onclick = () => {
  main.style.display = "none";
  spam.style.display = "none";
  finalImg.style.display = "block";
  fireworks();
};

const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

let parts=[];
function fireworks(){
  setInterval(()=>{
    for(let i=0;i<80;i++){
      parts.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height/2,
        vx:(Math.random()-0.5)*6,
        vy:(Math.random()-0.5)*6,
        life:80,
        c:`hsl(${Math.random()*360},100%,50%)`
      });
    }
  },400);
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  parts.forEach((p,i)=>{
    p.x+=p.vx; p.y+=p.vy; p.life--;
    ctx.fillStyle=p.c;
    ctx.fillRect(p.x,p.y,3,3);
    if(p.life<=0) parts.splice(i,1);
  });
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
